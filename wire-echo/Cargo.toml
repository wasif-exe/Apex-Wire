[package]
name = "wire-echo"
version = "0.1.0"
edition = "2021"

[dependencies]
wire-core = { path = "../wire-core" }
wire-xdp = { path = "../wire-xdp" }
wire-simd = { path = "../wire-simd" }
wire-store = { path = "../wire-store" }
wire-pacer = { path = "../wire-pacer" }
wire-sim = { path = "../wire-sim" }
wire-tap = { path = "../wire-tap" }
wire-quic = { path = "../wire-quic" }
wire-runtime = { path = "../wire-runtime" }
wire-disruptor = { path = "../wire-disruptor" }
wire-exchange = { path = "../wire-exchange" }
wire-dma = { path = "../wire-dma" }
wire-risk = { path = "../wire-risk" }
wire-ptp = { path = "../wire-ptp" }
wire-mcast = { path = "../wire-mcast" }
wire-vfio = { path = "../wire-vfio" }
wire-onload = { path = "../wire-onload" }
wire-sor = { path = "../wire-sor" }
wire-ptp-servo = { path = "../wire-ptp-servo" }
wire-matching = { path = "../wire-matching" }
wire-alloc = { path = "../wire-alloc" }
wire-mpmc = { path = "../wire-mpmc" }
anyhow = "1.0"
libc = "0.2"
io-uring = "0.6"
rustls = { workspace = true, features = ["ring", "std"] }
tracing-subscriber = { workspace = true }

[features]
default = []
profile = ["wire-core/profile", "wire-xdp/profile"]
