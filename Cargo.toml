[workspace]
resolver = "2"
members = [
    "aw-pacer",
    "aw-store",
    "aw-simd",
    "aw-core",
    "aw-tap",
    "aw-sim",
    "aw-echo",
    "aw-xdp",
    "aw-uring",
    "aw-quic",
    "aw-runtime",
    "aw-disruptor",
    "aw-exchange",
    "aw-dma",
    "aw-risk",
    "aw-ptp",
    "aw-mcast",
    "aw-vfio",
    "aw-onload",
    "aw-sor",
    "aw-ptp-servo",
    "aw-matching",
    "aw-alloc",
    "aw-mpmc",
    "aw-pipeline",
    "aw-pmc",
    "aw-gen",
    "aw-markv-bridge",
    "aw-bench",
]

[workspace.dependencies]
libc = "0.2"
bitflags = "2.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1.7"
smallvec = "1.13"
thiserror = "1.0"
anyhow = "1.0"
io-uring = "0.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
ring = "0.17"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
